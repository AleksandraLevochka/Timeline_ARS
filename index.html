<!DOCTYPE html>
<html lang="en">

<head>
    <link href="style.css" rel="stylesheet">

    <link rel="stylesheet" href="https://use.typekit.net/ixg2rae.css">
    <link rel="stylesheet" href="https://use.typekit.net/ixg2rae.css">

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <div class="year-box green">2021</div>

    <div id="hover-image-container">
        <img id="hover-image" src="" alt="Year Info Image">
    </div>

    <div id="text-info-container">
        <h2 id="text-title"></h2>
        <p id="text-body"></p>
    </div>
